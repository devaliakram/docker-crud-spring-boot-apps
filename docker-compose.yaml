version: "3.8"

services:
  # MySQL Database Service
  mysql-db:
    image: 'mysql:latest'
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: admin12
      MYSQL_DATABASE: crud
    ports:
      - '3307:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - app-network

  # Redis Cache Service
  redis:
    image: 'redis:latest'
    container_name: redis-cache
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
      interval: 5s
    networks:
      - app-network

  # Spring Boot Application Service
  application:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker-spring-boot:1.0
    container_name: spring-app
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '9192:9192'
    environment:
      # Database connection string using the service name 'mysql-db'
      SPRING_DATASOURCE_URL: 'jdbc:mysql://mysql-db:3306/crud?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC'

      # Credentials (Note: Ensure USERNAME matches your DB setup, typically 'root')
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin12

      # Redis connection settings
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    restart: on-failure
    networks:
      - app-network

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge

